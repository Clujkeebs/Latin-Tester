<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocābulārium — Cambridge Latin Course Vocabulary Tester</title>
<meta name="description" content="A free study tool for Cambridge Latin Course vocabulary, Stages I–XII. Flashcards, multiple choice and typing practice. No sign-up.">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151310" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Vocābulārium — Latin Vocabulary Tester">
<meta property="og:description" content="Cambridge Latin Course vocabulary, Stages I–XII. Flashcards, multiple choice, typing. Free, no sign-up.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23a8412a'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='40' fill='%23fffdf8' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<script>
  /* Apply the saved theme before first paint so the page never flashes. */
  (function () {
    try {
      var t = localStorage.getItem("clc-vocab-theme-v1");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
</head>
<body>
<div class="page">
  <div class="shell">
    <div class="topbar">
      <span class="topbar-mark">Vocābulārium</span>
      <button type="button" id="theme-toggle" class="theme-toggle" data-action="theme" aria-label="Change theme"></button>
    </div>
    <div id="app">
      <noscript>
        <p style="padding:24px 0">This study tool needs JavaScript switched on.</p>
      </noscript>
    </div>
  </div>
</div>
<script src="vocab.js"></script>
<script src="app.js"></script>
</body>
</html>
